{% extends "portfolio/base.html" %}
{% block title %}Import Workbook{% endblock %}
{% block content %}
<section class="form-panel">
  <h1>Import Workbook</h1>
  <p class="muted">Imports the current Master-Immos workbook structure into properties, tenants, rent history, annual snapshots, and loans.</p>
  <form method="post" enctype="multipart/form-data" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Import</button>
  </form>
</section>
{% endblock %}
